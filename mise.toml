monorepo_root = true

[env]
_.source = "{{ config_root }}/mise-env/docker.sh"

[monorepo]
config_roots = [
    "modules/*",
]

[tools]
go = "1.27.1"
golangci-lint = "2.14.0"
protoc = "36.2"
protoc-gen-go = "1.36.12"
protoc-gen-go-grpc = "1.6.2"
"go:github.com/kazhuravlev/options-gen/cmd/options-gen" = "v0.58.0"
"go:github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen" = "v2.8.0"

[tasks.all]
description = "Generate, tidy, build, test, and lint every module sequentially"
run = '''
MISE_JOBS=1 mise run //modules/...:all
'''
