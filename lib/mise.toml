[tasks.all]
run = [
    { task = "generate" },
    { task = "modules" },
    { task = "build" },
    { task = "test" },
    { task = "lint" },
]

[tasks.generate]
run = [
    { task = "grpc-generate" },
    { task = "go-generate" },
]

[tasks.go-generate]
run = "go generate ./..."

[tasks.grpc-generate]
run = """
#!/usr/bin/env sh
set -eu

find "$PWD" -name '*.proto' | while read -r proto_file; do
    protoc \
        --proto_path="$PWD" \
        --go_out="$PWD" \
        --go_opt=paths=source_relative \
        --go-grpc_out="$PWD" \
        --go-grpc_opt=paths=source_relative \
        "$proto_file"
done
"""

[tasks.modules]
run = "go mod tidy"

[tasks.build]
run = "go build ./..."

[tasks.test]
run = "go test ./..."

[tasks.lint]
run = "golangci-lint run"

